# Sveltia CMS 설정 — https://hoohdini.github.io/admin/ 에서 글을 쓰고 저장하면 main 브랜치에 커밋되고,
# GitHub Actions가 자동으로 사이트를 다시 배포합니다(1~2분).

backend:
  name: github
  repo: hoohdini/hoohdini.github.io
  branch: main
  commit_messages:
    create: "글 추가: {{slug}}"
    update: "글 수정: {{slug}}"
    delete: "글 삭제: {{slug}}"
    uploadMedia: "이미지 업로드: {{path}}"
    deleteMedia: "이미지 삭제: {{path}}"

site_url: https://hoohdini.github.io
display_url: https://hoohdini.github.io

# 붙여넣거나 끌어다 놓은 이미지가 저장되는 곳
media_folder: assets/img/posts
public_folder: /assets/img/posts

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: _posts
    create: true
    # Jekyll은 YYYY-MM-DD-제목.md 형식의 파일만 글로 인식합니다
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    summary: "{{title}} · {{date | date('YYYY.MM.DD')}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: 논문 리뷰, field: categories, pattern: 논문 리뷰 }
      - { label: 프로젝트, field: categories, pattern: 프로젝트 }
      - { label: 학습 노트, field: categories, pattern: 학습 노트 }
    fields:
      - { name: title, label: 제목, widget: string }
      - name: date
        label: 날짜
        widget: datetime
        default: "{{now}}"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
      # Chirpy는 첫 번째 값을 큰 분류, 두 번째 값을 세부 분류로 씁니다
      - name: categories
        label: 카테고리
        label_singular: 분류
        widget: list
        min: 1
        max: 2
        hint: "첫 칸에 큰 분류, (선택) 둘째 칸에 세부 분류를 고르세요. 예: 프로젝트 → 인턴"
        field:
          name: category
          label: 분류
          widget: select
          options:
            - { label: "① 큰 분류 · 논문 리뷰", value: 논문 리뷰 }
            - { label: "① 큰 분류 · 프로젝트", value: 프로젝트 }
            - { label: "① 큰 분류 · 학습 노트", value: 학습 노트 }
            - { label: "② 프로젝트 › 인턴", value: 인턴 }
            - { label: "② 프로젝트 › 연구", value: 연구 }
            - { label: "② 프로젝트 › 사이드", value: 사이드 }
            - { label: "② 프로젝트 › 공모전", value: 공모전 }
            - { label: "② 논문 리뷰 › 학회 스터디", value: 학회 스터디 }
            - { label: "② 논문 리뷰 › 개인", value: 개인 }
            - { label: "② 학습 노트 › DSL 세션", value: DSL 세션 }
            - { label: "② 학습 노트 › 딥러닝", value: 딥러닝 }
      - name: tags
        label: 태그
        widget: list
        required: false
        hint: "쉼표로 구분 (예: deep learning, recommendation)"
      - name: description
        label: 요약
        widget: text
        required: false
        hint: "목록과 검색 결과에 보이는 한두 문장. 비워두면 본문 앞부분이 쓰입니다."
      - name: image
        label: 대표 이미지
        widget: image
        required: false
      - name: math
        label: 수식 사용
        widget: boolean
        default: false
        hint: "$...$ 수식을 쓰는 글이면 켜세요"
      - name: published
        label: 공개
        widget: boolean
        default: true
        hint: "끄면 저장은 되지만 사이트에는 나오지 않습니다 (임시 저장용)"
      - name: body
        label: 본문
        widget: markdown
        # 수식($...$)이나 Chirpy 전용 문법({: .prompt-tip })이 있는 글은 툴바에서 Markdown 모드로 바꿔서 편집하세요
        modes: [rich_text, raw]
        editor_components: [code-block, image, table]
